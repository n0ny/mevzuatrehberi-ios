name: iOS derleme

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini oluştur
        run: xcodegen generate

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: iPhone için imzasız derleme
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project MevzuatRehberi.xcodeproj -scheme MevzuatRehberi \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO

      - name: IPA paketle
        run: |
          mkdir -p build/Unsigned/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/MevzuatRehberi.app build/Unsigned/Payload/
          cd build/Unsigned
          zip -qry ../MevzuatRehberi-imzasiz.ipa Payload

      - name: IPA dosyasını kaydet
        uses: actions/upload-artifact@v5
        with:
          name: MevzuatRehberi-imzasiz-IPA
          path: build/MevzuatRehberi-imzasiz.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Simülatör seç
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[x["udid"] for r,xs in d["devices"].items() if "iOS" in r for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")]; assert ids, "iPhone simülatörü yok"; print(ids[0])')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Testler
        run: |
          set -o pipefail
          xcodebuild test -quiet \
            -project MevzuatRehberi.xcodeproj -scheme MevzuatRehberi \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO
